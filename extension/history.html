<!doctype html>
<html lang="fr">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Historique des analyses</title>
<style>
  :root {
    color-scheme: dark;
    --surface: #14161a;
    --panel: #1b1e23;
    --border: #2a2e35;
    --text: #e8eaed;
    --text-2: #c3c7ce;
    --muted: #8b9199;
    --series: #3987e5;
    --vert: #34d399;
    --orange: #fbbf24;
    --rouge: #f87171;
    --link: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--text); font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 14px; margin: 22px 0 8px; }
  .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button, .btn { font: inherit; font-size: 12px; cursor: pointer; border-radius: 6px; padding: 6px 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  button:hover { border-color: #3b414b; }
  button.danger { color: var(--rouge); }
  button.primary, .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn:hover { text-decoration: none; }
  input[type=search] { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: #0e1013; color: var(--text); width: min(320px, 100%); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; background: var(--panel); position: sticky; top: 0; }
  td.num, th.num { text-align: right; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: #1f232a; }
  .badge { display: inline-block; min-width: 54px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .05em; padding: 1px 7px; border-radius: 999px; }
  .b-vert { background: var(--vert); color: #04281c; } .b-orange { background: var(--orange); color: #2d1f02; } .b-rouge { background: var(--rouge); color: #2d0606; }
  .up { color: var(--rouge); font-weight: 600; } .down { color: var(--vert); font-weight: 600; } .flat { color: var(--muted); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .empty { padding: 30px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 8px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .tile .k { color: var(--muted); font-size: 11px; }
  .tile .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; }
  .tip { position: absolute; pointer-events: none; background: #0e1013; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .finding { display: flex; gap: 8px; margin: 3px 0; }
  .finding .ico { flex: 0 0 14px; text-align: center; }
  .sev-critical { color: var(--rouge); } .sev-warning { color: var(--orange); } .sev-ok { color: var(--vert); } .sev-info { color: var(--muted); }
  .module { margin-bottom: 12px; }
  .module .title { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
  details summary { cursor: pointer; color: var(--text-2); }
  pre { overflow: auto; max-height: 420px; background: #0e1013; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 11px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 0; }
  dt { color: var(--muted); } dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
  .gain { color: var(--vert); font-weight: 600; } .loss { color: var(--rouge); font-weight: 600; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 0 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-2); vertical-align: 1px; }
  .tag.run { color: var(--vert); border-color: var(--vert); } .tag.rug, .tag.dead { color: var(--rouge); border-color: var(--rouge); }
  label.opt { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--text-2); cursor: pointer; }
  .notice { padding: 8px 10px; border-radius: 6px; font-size: 12px; margin: 0 0 12px; background: var(--panel); border: 1px solid var(--border); color: var(--text-2); }
  .notice.dead { background: #3a0d0d; border-color: #5c1a1a; color: #fca5a5; }
  .share { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .share i { display: inline-block; height: 8px; border-radius: 2px; background: var(--series); }
  td.wrap { white-space: normal; min-width: 220px; }
</style>
<main id="app"><p class="muted">Chargement…</p></main>
<script type="module" src="dist/history.js"></script>
</html>
